<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Employee Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-dot"><i class="bi bi-briefcase-fill"></i></div>
      <span>Employee Management System</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html" class="active"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="pages/employees.html"><i class="bi bi-people"></i><span>Employees</span></a></li>
      <li><a href="pages/departments.html"><i class="bi bi-diagram-3"></i><span>Departments</span></a></li>
      <li><a href="pages/reports.html"><i class="bi bi-bar-chart"></i><span>Reports</span></a></li>
    </ul>
  </aside>

  <!-- Main -->
  <div class="main">

    <div class="topbar">
      <h4>Dashboard</h4>
      <div class="admin-chip">
        <div class="avatar"><i class="bi bi-person"></i></div>
        Admin
      </div>
    </div>

    <div class="content">

      <div class="row g-3">

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
            <div>
              <div class="stat-label">Total Employees</div>
              <div class="stat-value" id="totalEmployees">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon green"><i class="bi bi-diagram-3-fill"></i></div>
            <div>
              <div class="stat-label">Departments</div>
              <div class="stat-value" id="totalDepartments">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="bi bi-graph-up-arrow"></i></div>
            <div>
              <div class="stat-label">Highest Salary</div>
              <div class="stat-value" id="highestSalary">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon red"><i class="bi bi-cash-coin"></i></div>
            <div>
              <div class="stat-label">Average Salary</div>
              <div class="stat-value" id="averageSalary">-</div>
            </div>
          </div>
        </div>

      </div>

      <div class="panel mt-4">
        <h5>Recent Employees</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
              </tr>
            </thead>
            <tbody id="recentEmployees"></tbody>
          </table>
        </div>
      </div>

      <div class="mt-4">
        <a href="pages/employees.html" class="btn btn-primary me-2">Employees</a>
        <a href="pages/departments.html" class="btn btn-success me-2">Departments</a>
        <a href="pages/reports.html" class="btn btn-warning">Reports</a>
      </div>

    </div>
  </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
