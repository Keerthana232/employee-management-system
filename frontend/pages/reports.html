<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Employee Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-dot"><i class="bi bi-briefcase-fill"></i></div>
      <span>Employee Management System</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="../index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="employees.html"><i class="bi bi-people"></i><span>Employees</span></a></li>
      <li><a href="departments.html"><i class="bi bi-diagram-3"></i><span>Departments</span></a></li>
      <li><a href="reports.html" class="active"><i class="bi bi-bar-chart"></i><span>Reports</span></a></li>
    </ul>
  </aside>

  <div class="main">

    <div class="topbar">
      <h4>Reports</h4>
      <div class="admin-chip">
        <div class="avatar"><i class="bi bi-person"></i></div>
        Admin
      </div>
    </div>

    <div class="content">

      <div class="row g-3">

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
            <div>
              <div class="stat-label">Total Employees</div>
              <div class="stat-value" id="total">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon green"><i class="bi bi-arrow-up-circle"></i></div>
            <div>
              <div class="stat-label">Highest Salary</div>
              <div class="stat-value" id="highest">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="bi bi-arrow-down-circle"></i></div>
            <div>
              <div class="stat-label">Lowest Salary</div>
              <div class="stat-value" id="lowest">-</div>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="stat-icon red"><i class="bi bi-cash-coin"></i></div>
            <div>
              <div class="stat-label">Average Salary</div>
              <div class="stat-value" id="average">-</div>
            </div>
          </div>
        </div>

      </div>

      <div class="panel mt-4">
        <h5>Department-wise Employee Count</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>Department</th>
                <th>Total Employees</th>
                <th>Share</th>
              </tr>
            </thead>
            <tbody id="deptCountTable"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/report.js"></script>
</body>
</html>
