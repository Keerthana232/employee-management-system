<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments | Employee Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-dot"><i class="bi bi-briefcase-fill"></i></div>
      <span>Employee Management System</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="../index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="employees.html"><i class="bi bi-people"></i><span>Employees</span></a></li>
      <li><a href="departments.html" class="active"><i class="bi bi-diagram-3"></i><span>Departments</span></a></li>
      <li><a href="reports.html"><i class="bi bi-bar-chart"></i><span>Reports</span></a></li>
    </ul>
  </aside>

  <div class="main">

    <div class="topbar">
      <h4>Department List</h4>
      <div class="admin-chip">
        <div class="avatar"><i class="bi bi-person"></i></div>
        Admin
      </div>
    </div>

    <div class="content">

      <div class="panel">

        <div class="row g-2 mb-3">
          <div class="col-md-8">
            <input type="text" id="deptName" class="form-control" placeholder="Department Name">
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary w-100" onclick="saveDepartment()">
              <i class="bi bi-plus-lg"></i> Add Department
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>ID</th>
                <th>Department Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="departmentTable"></tbody>
          </table>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="../js/department.js"></script>
</body>
</html>
