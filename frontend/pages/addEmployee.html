<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Employee | Employee Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-dot"><i class="bi bi-briefcase-fill"></i></div>
      <span>Employee Management System</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="../index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="employees.html" class="active"><i class="bi bi-people"></i><span>Employees</span></a></li>
      <li><a href="departments.html"><i class="bi bi-diagram-3"></i><span>Departments</span></a></li>
      <li><a href="reports.html"><i class="bi bi-bar-chart"></i><span>Reports</span></a></li>
    </ul>
  </aside>

  <div class="main">

    <div class="topbar">
      <h4>Add Employee</h4>
      <div class="admin-chip">
        <div class="avatar"><i class="bi bi-person"></i></div>
        Admin
      </div>
    </div>

    <div class="content">

      <div class="panel" style="max-width:700px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Employee Details</h5>
          <a href="employees.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
          </a>
        </div>

        <form id="employeeForm">

          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" id="empName" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Salary</label>
              <input type="number" id="salary" class="form-control" placeholder="Enter salary" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Joining Date</label>
              <input type="date" id="joiningDate" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Department</label>
              <select id="department" class="form-select" required>
                <option value="">Select department</option>
              </select>
            </div>

          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Employee</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>

<script src="../js/employee.js"></script>
</body>
</html>
