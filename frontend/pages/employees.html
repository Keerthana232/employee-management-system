<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees | Employee Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-dot"><i class="bi bi-briefcase-fill"></i></div>
      <span>Employee Management System</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="../index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="employees.html" class="active"><i class="bi bi-people"></i><span>Employees</span></a></li>
      <li><a href="departments.html"><i class="bi bi-diagram-3"></i><span>Departments</span></a></li>
      <li><a href="reports.html"><i class="bi bi-bar-chart"></i><span>Reports</span></a></li>
    </ul>
  </aside>

  <div class="main">

    <div class="topbar">
      <h4>Employee List</h4>
      <div class="admin-chip">
        <div class="avatar"><i class="bi bi-person"></i></div>
        Admin
      </div>
    </div>

    <div class="content">

      <div class="panel">

        <div class="row g-2 mb-3">
          <div class="col-md-4">
            <input type="text" id="searchEmployee" class="form-control"
                   placeholder="Search by name or email" onkeyup="searchEmployee()">
          </div>
          <div class="col-md-4">
            <select id="departmentFilter" class="form-select" onchange="filterDepartment()">
              <option value="">All Departments</option>
            </select>
          </div>
          <div class="col-md-4 text-end">
            <a href="addEmployee.html" class="btn btn-primary">
              <i class="bi bi-plus-lg"></i> Add Employee
            </a>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Salary</th>
                <th>Joining Date</th>
                <th>Department</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeeTable"></tbody>
          </table>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="../js/employee.js"></script>
</body>
</html>
